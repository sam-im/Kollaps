[workspace]
resolver = "3"
members = [
    "communicationcore",
    "communicationmanager",
    "capnp-schemas",
    "monitor",
    "monitor-common",
    "monitor-ebpf",
    "emulationcore",
    "controller",
]

# do not add monitor-ebpf to default-members or it won't compile
default-members = [
    "monitor",
    "monitor-common",
    "communicationcore",
    "communicationmanager",
    "capnp-schemas",
    "emulationcore",
    "controller"
]

# included by aya-rs project template
[profile.release.package.monitor-ebpf]
debug = 2
codegen-units = 1
